<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Suspended</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        .floating {
            animation: float 4s ease-in-out infinite;
        }
        #qris-card {
            transition: transform 0.15s ease-out, box-shadow 0.3s ease;
            transform-style: preserve-3d;
        }
        .card-wrapper {
            perspective: 1000px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-gray-800 to-black overflow-hidden">

    <div class="card-wrapper w-[85%] max-w-sm" id="wrapper">
        <img
            src="images/QRIS.jpeg"
            alt="QRIS Feri Cell"
            id="qris-card"
            class="w-full rounded-2xl shadow-[0_0_30px_rgba(255,255,255,0.15)] floating cursor-pointer"
        >
    </div>

    <script>
        const wrapper = document.getElementById('wrapper');
        const card = document.getElementById('qris-card');

        wrapper.addEventListener('mousemove', (e) => {
            card.classList.remove('floating');
            
            const rect = wrapper.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = ((y - centerY) / centerY) * -15;
            const rotateY = ((x - centerX) / centerX) * 15;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`;
            card.style.boxShadow = `${-rotateY}px ${rotateX}px 40px rgba(255, 255, 255, 0.3)`;
        });

        wrapper.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0) rotateY(0) scale3d(1, 1, 1)';
            card.style.boxShadow = '0 0 30px rgba(255,255,255,0.15)';
            setTimeout(() => card.classList.add('floating'), 150);
        });
    </script>
</body>
</html>
